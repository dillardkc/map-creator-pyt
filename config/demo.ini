# Use this config to refresh the file gdb used to create Custom Maps from PROD Enterprise environment.

[config]
connections_folder = connections
projects_folder = projects


[dynamic_inputs]
parcels = Default.gdb\Parcels_with_Data
roads = Default.gdb\STREET_CENTERLINES
zoning = Default.gdb\Zoning
cup = Default.gdb\Conditional_Use_Permits


[static_inputs]
treelines = Default.gdb\TREES
waterfeatures = Default.gdb\STREAMS
countyboundary = Default.gdb\COUNTY_BOUNDARY
buildings = Default.gdb\BUILDINGS
landuse = Default.gdb\LandUse
town = Default.gdb\TOWN_BOUNDARY
historicaldistrict = Default.gdb\Overlay_Historical
magisterialdistrict = Default.gdb\MAGISTERIAL_DISTRICTS


[layer_lists]
# the layer names in this list should match the displayed layer names in the ArcGIS Pro map table of contents.
General Parcel = tempparcels, Ashland Boundary, Streets, Water, Trees, Buildings, Tax Parcels
Zoning = tempparcels, Ashland Boundary, Streets, Water, Tax Parcels, Conditional Use Permit, Zoning
Land Use = tempparcels, Ashland Boundary, Streets, Water, Tax Parcels, Land Use
Historical = tempparcels, Ashland Boundary, Streets, Water, Tax Parcels, Historical District
Aerials = tempparcels, Ashland Boundary, Streets, Tax Parcels, World Imagery


[buffer_sizes_8.5x11]
200 = 750 Feet
300 = 1125 Feet
400 = 1500 Feet
500 = 1875 Feet
600 = 2250 Feet
700 = 2625 Feet
800 = 3000 Feet


[buffer_sizes_11x17]
200 = 1000 Feet
300 = 1500 Feet
400 = 2000 Feet
500 = 2500 Feet
600 = 3000 Feet
700 = 3500 Feet
800 = 4000 Feet